name: Scheduled DevOps Health Check

on:
  schedule:
    - cron: "0 4 * * *" # Daily at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  run-agents:
    name: Run DevOps Automation Agents
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ".github/scripts/requirements.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt

      - name: Run Repository Health Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/agents/repo_health_agent.py

      - name: Run Security & Dependency Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/agents/security_dependency_agent.py

      - name: Commit Updated Reports (If Changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain reports/)" ]; then
            echo "Report changes detected. Committing updated reports..."
            git add reports/
            git commit -m "chore(reports): update devops health and security reports [skip ci]"
            git push
          else
            echo "Zero report changes detected. Skipping commit (no-fake-activity rule)."
          fi

      - name: Publish Action Summary
        if: always()
        run: |
          echo "## 🛡️ Scheduled DevOps Health Check Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Both Repository Health and Security & Dependency agents completed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "reports/repo-health-report.md" ]; then
            echo "### 📄 Repository Health Summary" >> $GITHUB_STEP_SUMMARY
            head -n 25 reports/repo-health-report.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "reports/security-dependency-report.md" ]; then
            echo "### 🔒 Security & Dependency Summary" >> $GITHUB_STEP_SUMMARY
            head -n 25 reports/security-dependency-report.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

